name: DeepScan · Auditoría bot IA · Semanal
# Lee una muestra de conversaciones reales del bot de Ofero (UChat), las hace
# auditar por un LLM gratis (Groq · Llama 3.3 70B) y guarda el resultado en
# uchat_bot_audit. Corre una vez por semana (lunes temprano). Barato/gratis:
# ~120 conversaciones agrupadas en pocos lotes.
on:
  schedule:
    - cron: "30 8 * * 1"   # lunes 08:30 UTC (~03:30 Colombia)
  workflow_dispatch:
jobs:
  bot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: pip install -r etl/requirements.txt
      - name: Auditoría del bot con IA
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEFAULT_CLIENT_ID:    ${{ secrets.OFERO_CLIENT_ID }}
          UCHAT_API_TOKEN:      ${{ secrets.OFERO_UCHAT_API_TOKEN }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL:            "llama-3.3-70b-versatile"
          BOT_AUDIT_TARGET:     "120"
          BOT_AUDIT_BATCH:      "10"
        run: |
          cd etl
          python run_bot_audit.py
      - name: Notificar error en Slack (opcional)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ DeepScan · Auditoría bot IA (semanal) falló — revisar GitHub Actions"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
